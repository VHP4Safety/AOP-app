name: Build and Publish Container Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build but do not publish, so forked PRs work without
      # registry credentials.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # The owner is spelled literally in lowercase on purpose:
          # ${{ github.repository_owner }} expands to "VHP4Safety" and Docker
          # rejects uppercase repository names.
          tags: |
            ghcr.io/vhp4safety/aopsuite:latest
            ghcr.io/vhp4safety/aopsuite:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
